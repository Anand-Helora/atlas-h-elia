<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#02181d"
    />

    <meta
      name="description"
      content="ATLAS H-ELIA — Contrôle des hydrants"
    />

    <!-- Paramètres d’installation sur iPhone et iPad -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="H-ELIA"
    />

    <title>ATLAS H-ELIA</title>

    <!-- Manifeste PWA -->
    <link
      rel="manifest"
      href="manifest.json"
    />

    <!-- Icône utilisée par Safari lors de l’ajout à l’écran d’accueil -->
    <link
      rel="apple-touch-icon"
      href="icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icon-192.png"
    />

    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <div id="app"></div>

    <noscript>
      <div class="noscript-message">
        JavaScript doit être activé pour utiliser ATLAS H-ELIA.
      </div>
    </noscript>

    <!-- Lecture des QR codes (navigateurs sans lecteur natif) -->
    <script src="jsQR.js" defer></script>

    <script src="config.js" defer></script>
    <script src="store.js" defer></script>
    <script src="scanner.js" defer></script>
    <script src="export.js" defer></script>
    <script src="app.js" defer></script>

    <!-- Activation de la PWA -->
    <script src="pwa.js" defer></script>
  </body>
</html>
